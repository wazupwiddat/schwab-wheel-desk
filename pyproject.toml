[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wheel-desk"
version = "0.1.0"
description = "A read-only Charles Schwab trading assistant CLI."
requires-python = ">=3.9"
dependencies = [
    "cryptography>=42.0.0",
    "keyring>=24.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "urllib3<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["src"]
